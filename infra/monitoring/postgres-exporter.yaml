# Exposes Postgres health and activity (pg_up, connections, database size) as
# Prometheus metrics. Runs as its own Deployment rather than a sidecar, so it
# keeps reporting pg_up=0 while the database pod is gone.
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: lyricstats
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/part-of: lyricstats
spec:
  selector:
    app.kubernetes.io/name: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: lyricstats
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/part-of: lyricstats
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
        app.kubernetes.io/part-of: lyricstats
        app.kubernetes.io/component: monitoring
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          args:
            - --no-collector.stat_bgwriter
          env:
            - name: DATA_SOURCE_URI
              value: postgres:5432/lyricstats?sslmode=disable
            - name: DATA_SOURCE_USER
              value: lyricstats
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          ports:
            - name: metrics
              containerPort: 9187
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
