# Synthetic users. Scale to zero to see what the dashboards look like with no
# traffic: kubectl -n lyricstats scale deploy/loadgen --replicas=0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/component: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
        app.kubernetes.io/component: loadgen
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          # Reuses the API image for its Python runtime; the script is mounted.
          image: lyricstats-api:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "/tools/loadgen.py"]
          env:
            - name: TARGET
              value: http://traefik.kube-system.svc.cluster.local
            - name: HOST_HEADER
              value: lyricstats.localhost
            - name: RPS
              value: "4"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /tools
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: loadgen-script
