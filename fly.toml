app = "lyricstats"
primary_region = "ams"

[build]

[env]
  LYRICSTATS_DB = "/data/lyricstats.db"
  NEXT_TELEMETRY_DISABLED = "1"
  PORT = "3000"

[[mounts]]
  source = "lyricstats_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
