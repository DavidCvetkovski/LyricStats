[project]
name = "lyricstats"
version = "0.1.0"
description = "Stats for lyrics, per song and per artist."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36",
    "lyricsgenius>=3.0.1",
    "sqlmodel>=0.0.22",
    "python-dotenv>=1.0",
    "langdetect>=1.0.9",
    "pandas>=2.2",
    "altair>=5.3",
    "requests>=2.32",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
