[project]
name = "lyricstats"
version = "0.1.0"
description = "Stats for lyrics, per song and per artist."
requires-python = ">=3.11"
dependencies = [
    "lyricsgenius>=3.0.1",
    "sqlmodel>=0.0.22",
    "python-dotenv>=1.0",
    "pandas>=2.2",          # build-time: scripts/import_dataset.py streams the dataset CSV
    "requests>=2.32",
    "tenacity>=8.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",  # local ASGI server (uvicorn backend.main:app)
    "psycopg[binary]>=3.1.8",
    "duckdb>=1.5.3",
    "tqdm>=4.68.2",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# Build-time only: training the non-song title classifier during dataset import.
# Never installed on Vercel (the app reads precomputed aggregates).
import-ml = [
    "fasttext-wheel>=0.9.2",
    "numpy>=1.26,<2",  # fasttext-wheel 0.9.2 predict() uses np.array(copy=False), removed in numpy 2
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
