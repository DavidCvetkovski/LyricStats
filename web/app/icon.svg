<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Pinyon+Script&amp;display=swap');
      .bg {
        fill: #f6f1e8;
      }
      .border {
        fill: none;
        stroke: #1a1614;
        stroke-width: 12;
        opacity: 0.08;
      }
      .text-L {
        font-family: 'Pinyon Script', cursive, Georgia, serif;
        fill: #1a1614;
        font-size: 380px;
        text-anchor: middle;
      }
      .text-S {
        font-family: 'Pinyon Script', cursive, Georgia, serif;
        fill: #7a1f2b;
        font-size: 380px;
        text-anchor: middle;
        mix-blend-mode: multiply;
      }
    </style>
  </defs>
  <!-- Squircle container -->
  <rect width="512" height="512" rx="112" class="bg" />
  <rect x="6" y="6" width="500" height="500" rx="106" class="border" />
  
  <!-- Monogram LS intertwined -->
  <!-- L is offset to the left and slightly higher -->
  <text x="190" y="340" class="text-L">L</text>
  
  <!-- S is offset to the right and lower, overlapping L with blend mode -->
  <text x="310" y="380" class="text-S">S</text>
</svg>
